{% extends 'base.html' %}{% block page %}register{% endblock %}{% block content %}<main class="auth"><section class="auth-shell"><aside class="auth-art"><a class="brand" href="/"><i class="mark">₹</i><span>GramSatark<small>Every Rupee. Every Project. Every Voice.</small></span></a><h1>Know your village.<br>Raise your voice.</h1></aside><section class="auth-card"><form class="form" id="auth-form"><nav class="tabs"><a href="/login">Login</a><button class="active" type="button">Register</button></nav><h2>Create citizen account</h2><p>Join your real village workspace.</p><label>Full name</label><input name="name" required><label>Email address</label><input name="email" type="email" required><label>Mobile number</label><input name="phone" required placeholder="10-digit mobile"><label>Village</label><select name="village_id" required><option value="">Select your village</option>{% for v in villages %}<option value="{{ v.id }}">{{ v.name }}, {{v.district}}</option>{% endfor %}</select><label>Password</label><input name="password" type="password" required placeholder="8+ characters: a letter and number"><div class="form-message"></div><button class="btn" style="width:100%">Create account</button><div class="helper">Village missing? <a class="link" href="/village-onboarding">Request village onboarding</a></div></form></section></section></main>{% endblock %}
