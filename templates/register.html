{% extends 'base.html' %}{% block page %}register{% endblock %}{% block content %}<main class="auth-shell"><section class="auth-art"><a href="/" class="brand"><i class="brand-mark">₹</i><span>GramSatark<small class="tag">Every Rupee. Every Project. Every Voice.</small></span></a><h1>Your village.<br>Your voice.</h1><p class="muted">Create an account to follow every public project.</p></section><section class="auth-form"><form class="form-card card" id="auth-form"><div class="tabs"><a class="tab" href="/login">Login</a><button class="tab active" type="button">Register</button></div><h2>Create account</h2><div class="form-row"><div><label>Full name</label><input name="name" required></div><div><label>Mobile number</label><input name="phone" required placeholder="10-digit mobile"></div></div><label>Email address</label><input name="email" type="email" required><label>Village</label><select name="village_id" required><option value="">Select your village</option>{% for v in villages %}<option value="{{v.id}}">{{v.name}}</option>{% endfor %}</select><label>Password</label><input name="password" type="password" required placeholder="8+ characters, a letter and a number"><div id="auth-message" class="form-message"></div><button class="btn" style="width:100%">Create account</button><p class="muted" style="text-align:center">Already registered? <a href="/login" style="color:var(--green)">Log in</a></p></form></section></main>{% endblock %}
